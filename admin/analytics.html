<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计分析 - 无人移动点餐系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="analytics">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo">点</div><div><div class="sidebar-title">点餐后台</div><div class="sidebar-subtitle">Management</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">菜品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
        <a class="nav-item" data-page="orders" href="orders.html">订单管理</a>
        <a class="nav-item" data-page="users" href="users.html">用户管理</a>
        <a class="nav-item" data-page="coupons" href="coupons.html">优惠券管理</a>
        <a class="nav-item" data-page="activities" href="activities.html">活动管理</a>
        <a class="nav-item" data-page="analytics" href="analytics.html">统计分析</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><button class="btn ghost menu-toggle" id="menuToggle">菜单</button><h1>统计分析</h1><p>从订单、商品、用户三个角度展示经营情况。</p></div>
        <div class="top-actions"><div class="admin-user"><span class="avatar">A</span> 管理员</div><button class="btn ghost" id="logoutBtn">退出</button></div>
      </header>
      <section class="grid stats-grid">
        <div class="card stat-card"><div class="stat-label">客单价</div><div class="stat-value">¥18.6</div><div class="stat-change">较上周 +3.4%</div></div>
        <div class="card stat-card"><div class="stat-label">复购率</div><div class="stat-value">42%</div><div class="stat-change">会员贡献明显</div></div>
        <div class="card stat-card"><div class="stat-label">优惠成本</div><div class="stat-value">¥168</div><div class="stat-change">占营业额 6.2%</div></div>
        <div class="card stat-card"><div class="stat-label">高峰时段</div><div class="stat-value">14:00</div><div class="stat-change">下午茶订单集中</div></div>
      </section>
      <section class="grid content-grid" style="margin-top:18px;">
        <div class="card">
          <div class="card-header"><h2>品类销售占比</h2><span class="muted">基于当前商品销量展示</span></div>
          <div class="chart-bars">
            <div class="bar-row"><span>咖啡</span><div class="bar"><span style="width:46%;"></span></div><strong>46%</strong></div>
            <div class="bar-row"><span>果茶</span><div class="bar"><span style="width:28%;"></span></div><strong>28%</strong></div>
            <div class="bar-row"><span>奶茶</span><div class="bar"><span style="width:18%;"></span></div><strong>18%</strong></div>
            <div class="bar-row"><span>小食</span><div class="bar"><span style="width:8%;"></span></div><strong>8%</strong></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2>分析结论</h2></div>
          <p class="muted">下午茶时段订单最多，橙香美式和西柚绿茶适合继续放在首页热门推荐位。</p>
          <p class="muted">可结合后台订单、优惠券和菜品销量，继续优化商品结构和运营策略。</p>
        </div>
      </section>
    </main>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
