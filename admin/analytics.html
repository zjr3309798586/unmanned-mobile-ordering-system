<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计分析 - 云豹小点后台管理</title>
  <link rel="stylesheet" href="css/admin.css?v=19">
</head>
<body data-page="analytics">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo"><img src="../images/mascot/mascot-yunbao-144.png" alt="云豹小点"></div><div><div class="sidebar-title">云豹小点后台</div><div class="sidebar-subtitle">后台管理</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">商品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
        <a class="nav-item" data-page="orders" href="orders.html">订单管理</a>
        <a class="nav-item" data-page="support" href="support.html">客服管理</a>
        <a class="nav-item" data-page="users" href="users.html">用户管理</a>
        <a class="nav-item" data-page="coupons" href="coupons.html">优惠券管理</a>
        <a class="nav-item" data-page="activities" href="activities.html">活动管理</a>
        <a class="nav-item" data-page="analytics" href="analytics.html">统计分析</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><button class="btn ghost menu-toggle" id="menuToggle">菜单</button><h1>统计分析</h1><p>按订单、商品和用户维度统计经营数据。</p></div>
        <div class="top-actions"><div class="admin-user"><span class="avatar">J</span><span>管理员</span></div><button class="btn ghost" id="logoutBtn">退出</button></div>
      </header>
      <section class="grid stats-grid">
        <div class="card stat-card"><div class="stat-label">客单价</div><div class="stat-value">加载中</div><div class="stat-change">按未取消订单计算</div></div>
        <div class="card stat-card"><div class="stat-label">复购率</div><div class="stat-value">加载中</div><div class="stat-change">有两笔及以上订单的用户占比</div></div>
        <div class="card stat-card"><div class="stat-label">优惠成本</div><div class="stat-value">加载中</div><div class="stat-change">来自订单已抵扣金额</div></div>
        <div class="card stat-card"><div class="stat-label">高峰时段</div><div class="stat-value">加载中</div><div class="stat-change">按订单创建时间统计</div></div>
      </section>
      <section class="grid content-grid" style="margin-top:18px;">
        <div class="card">
          <div class="card-header"><h2>品类销售占比</h2><span class="muted">基于当前商品销量统计</span></div>
          <div class="chart-bars analytics-category-bars">
            <p class="muted">正在加载品类数据...</p>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2>经营备注</h2></div>
          <p class="muted">正在加载经营数据...</p>
          <p class="muted"></p>
        </div>
      </section>
    </main>
  </div>
  <script src="js/admin.js?v=19"></script>
</body>
</html>
