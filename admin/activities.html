<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动管理 - 云豹小点后台管理</title>
  <link rel="stylesheet" href="css/admin.css?v=19">
</head>
<body data-page="activities">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo"><img src="../images/mascot/mascot-yunbao-144.png" alt="云豹小点"></div><div><div class="sidebar-title">云豹小点后台</div><div class="sidebar-subtitle">后台管理</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">商品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
        <a class="nav-item" data-page="orders" href="orders.html">订单管理</a>
        <a class="nav-item" data-page="support" href="support.html">客服管理</a>
        <a class="nav-item" data-page="users" href="users.html">用户管理</a>
        <a class="nav-item" data-page="coupons" href="coupons.html">优惠券管理</a>
        <a class="nav-item" data-page="activities" href="activities.html">活动管理</a>
        <a class="nav-item" data-page="analytics" href="analytics.html">统计分析</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><button class="btn ghost menu-toggle" id="menuToggle">菜单</button><h1>活动管理</h1><p>维护首页 Banner、活动入口和跳转配置。</p></div>
        <div class="top-actions"><div class="admin-user"><span class="avatar">J</span><span>管理员</span></div><button class="btn ghost" id="logoutBtn">退出</button></div>
      </header>
      <section class="activity-list">
        <div class="small-card"><strong>正在加载活动位...</strong><p class="muted">请稍候</p></div>
      </section>
      <section class="card" style="margin-top:18px;">
        <div class="card-header"><h2>活动配置</h2><span class="muted">保存后同步到前台首页</span></div>
        <div class="form-grid">
          <div class="field"><label>Banner 标题</label><input placeholder="蓝杯鲜饮 轻松点单"></div>
          <div class="field"><label>角标文字</label><input placeholder="云豹上新"></div>
          <div class="field wide"><label>副标题</label><input placeholder="活动说明"></div>
          <div class="field"><label>按钮文字</label><input placeholder="去点餐"></div>
          <div class="field"><label>跳转地址</label><input placeholder="menu.html"></div>
          <div class="field"><label>排序</label><input type="number" placeholder="1"></div>
          <div class="field"><label>状态</label><select><option>启用</option><option>停用</option></select></div>
          <div class="field wide image-field"><label>Banner 图片</label><input placeholder="/images/home/home-banner-1.png"><p class="image-help">建议使用横向宣传图，保存后同步到首页 Banner。</p></div>
        </div>
        <button class="btn" type="button">保存 Banner</button>
      </section>
    </main>
  </div>
  <script src="js/admin.js?v=19"></script>
</body>
</html>
