<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 云豹小点后台管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page" data-page="login">
  <section class="login-card">
    <div class="login-hero">
      <div class="brand-badge">
        <span class="brand-dot"><img src="../images/mascot/mascot-yunbao-144.png" alt="云豹小点"></span>
        <span>云豹小点</span>
      </div>
      <h1>后台管理端</h1>
      <p>用于处理云豹小点订单、维护商品、管理优惠券和查看经营数据。</p>
    </div>

    <div class="login-form">
      <h2>管理员登录</h2>
      <p>请输入后台管理员账号和密码。</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">账号</label>
          <input id="username" type="text" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn full" type="submit">进入后台</button>
      </form>
      <div class="login-tip">请使用管理员账号登录，登录后可维护商品、订单、优惠券和首页活动。</div>
    </div>
  </section>
  <script src="js/admin.js"></script>
</body>
</html>
