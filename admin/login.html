<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 无人移动点餐系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page" data-page="login">
  <section class="login-card">
    <div class="login-hero">
      <div class="brand-badge">
        <span class="brand-dot">点</span>
        <span>无人移动点餐系统</span>
      </div>
      <h1>后台管理端</h1>
      <p>用于查看营业数据、管理菜品分类、处理订单和维护优惠活动。当前已接入 Spring Boot 后端接口。</p>
    </div>

    <div class="login-form">
      <h2>管理员登录</h2>
      <p>请输入后台管理员账号和密码。</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">账号</label>
          <input id="username" type="text" value="admin" autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn full" type="submit">进入后台</button>
      </form>
      <div class="login-tip">默认账号：admin，默认密码：admin123。上线前请通过环境变量修改密码。</div>
    </div>
  </section>
  <script src="js/admin.js"></script>
</body>
</html>
