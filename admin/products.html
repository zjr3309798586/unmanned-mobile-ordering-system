<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 - 云豹小点后台管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="products">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo"><img src="../images/mascot/mascot-yunbao-144.png" alt="云豹小点"></div><div><div class="sidebar-title">云豹小点后台</div><div class="sidebar-subtitle">后台管理</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">商品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
        <a class="nav-item" data-page="orders" href="orders.html">订单管理</a>
        <a class="nav-item" data-page="users" href="users.html">用户管理</a>
        <a class="nav-item" data-page="coupons" href="coupons.html">优惠券管理</a>
        <a class="nav-item" data-page="activities" href="activities.html">活动管理</a>
        <a class="nav-item" data-page="analytics" href="analytics.html">统计分析</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><button class="btn ghost menu-toggle" id="menuToggle">菜单</button><h1>商品管理</h1><p>维护饮品、小食、图片、价格和上下架状态。</p></div>
        <div class="top-actions"><div class="admin-user"><span class="avatar">J</span><span>管理员</span></div><button class="btn ghost" id="logoutBtn">退出</button></div>
      </header>

      <section class="card">
        <div class="toolbar">
          <input class="search" data-table-search="#productsTable" placeholder="搜索商品名称、分类或状态">
          <button class="btn">新增商品</button>
        </div>
        <div class="table-wrap">
          <table id="productsTable">
            <thead><tr><th>图片</th><th>商品名称</th><th>分类</th><th>价格</th><th>销量</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td colspan="7" class="table-empty">正在加载商品...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card" style="margin-top:18px;">
        <div class="card-header"><h2>新增 / 编辑商品</h2><span class="muted">保存后前台点餐页同步更新</span></div>
        <div class="form-grid">
          <div class="field"><label>商品名称</label><input placeholder="香草拿铁"></div>
          <div class="field"><label>所属分类</label><select><option>咖啡</option><option>果茶</option><option>奶茶</option><option>小食</option></select></div>
          <div class="field"><label>价格</label><input placeholder="16.90"></div>
          <div class="field"><label>状态</label><select><option>在售</option><option>下架</option></select></div>
          <div class="field wide image-field"><label>商品图片</label><input placeholder="/images/menu/menu-product-milk-tea.png"><p class="image-help">可填写图片路径或上传本地图片，保存后前台点餐页同步展示。</p></div>
          <div class="field wide"><label>商品描述</label><textarea placeholder="填写商品口味、卖点和备注"></textarea></div>
        </div>
        <button class="btn">保存商品</button>
      </section>
    </main>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
