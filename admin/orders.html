<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - 云豹小点后台管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="orders">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo"><img src="../images/mascot/mascot-yunbao-144.png" alt="云豹小点"></div><div><div class="sidebar-title">云豹小点后台</div><div class="sidebar-subtitle">后台管理</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">商品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
        <a class="nav-item" data-page="orders" href="orders.html">订单管理</a>
        <a class="nav-item" data-page="users" href="users.html">用户管理</a>
        <a class="nav-item" data-page="coupons" href="coupons.html">优惠券管理</a>
        <a class="nav-item" data-page="activities" href="activities.html">活动管理</a>
        <a class="nav-item" data-page="analytics" href="analytics.html">统计分析</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><button class="btn ghost menu-toggle" id="menuToggle">菜单</button><h1>订单管理</h1><p>查看订单状态，处理出餐和取消。</p></div>
        <div class="top-actions"><div class="admin-user"><span class="avatar">J</span><span>管理员</span></div><button class="btn ghost" id="logoutBtn">退出</button></div>
      </header>

      <section class="admin-kpi-grid order-kpis" aria-label="订单运营概览">
        <div class="admin-kpi-card" data-order-kpi="waiting"><span>待取餐</span><strong class="order-kpi-value">0</strong><em>需要店员处理</em></div>
        <div class="admin-kpi-card" data-order-kpi="completed"><span>已完成</span><strong class="order-kpi-value">0</strong><em>今日经营沉淀</em></div>
        <div class="admin-kpi-card" data-order-kpi="canceled"><span>已取消</span><strong class="order-kpi-value">0</strong><em>异常订单跟进</em></div>
        <div class="admin-kpi-card is-strong" data-order-kpi="amount"><span>有效实付</span><strong class="order-kpi-value">¥ 0.00</strong><em>不含已取消订单</em></div>
      </section>

      <section class="card">
        <div class="toolbar">
          <div class="tabs">
            <button class="tab active" data-status-filter="all" data-target="#ordersTable">全部</button>
            <button class="tab" data-status-filter="waiting" data-target="#ordersTable">待取餐</button>
            <button class="tab" data-status-filter="done" data-target="#ordersTable">已完成</button>
            <button class="tab" data-status-filter="cancel" data-target="#ordersTable">已取消</button>
          </div>
          <input class="search" data-table-search="#ordersTable" placeholder="搜索订单号、用户或商品">
        </div>
        <div class="table-wrap">
          <table id="ordersTable">
            <thead><tr><th>订单号</th><th>用户</th><th>商品</th><th>金额</th><th>取餐方式</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td colspan="7" class="table-empty">正在加载订单...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
