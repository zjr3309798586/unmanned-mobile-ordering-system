    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><div class="sidebar-logo"><img src="../images/mascot-yunbao-144.png" alt="云豹小点"></div><div><div class="sidebar-title">云豹小点后台</div><div class="sidebar-subtitle">后台管理</div></div></div>
      <nav class="nav-list">
        <a class="nav-item" data-page="dashboard" href="dashboard.html">数据看板</a>
        <a class="nav-item" data-page="products" href="products.html">商品管理</a>
        <a class="nav-item" data-page="categories" href="categories.html">分类管理</a>
