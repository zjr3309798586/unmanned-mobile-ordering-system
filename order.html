<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>订单页 - 无人移动点餐系统</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/order.css">
</head>
<body data-page="order">
  <div class="app-shell">
    <header class="top-area">
      <section class="store-card compact-store">
        <div class="store-header">
          <div>
            <span class="store-label">订单中心</span>
            <h1 class="store-name">我的订单</h1>
          </div>
          <span class="status-pill is-open">可查看历史订单</span>
        </div>
        <p class="store-address">订单会保存在这里，支持查看进度、取消订单和再来一单。</p>
      </section>
    </header>

    <main class="page-main">
      <section class="section-card">
        <div class="order-tabs">
          <button class="tab-chip is-active" type="button" data-order-filter="all">全部订单</button>
          <button class="tab-chip" type="button" data-order-filter="current">进行中</button>
          <button class="tab-chip" type="button" data-order-filter="history">历史订单</button>
        </div>
      </section>

      <section class="order-list">
        <section class="section-card">
          <p class="section-note">正在读取订单...</p>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="index.html">
        <span class="nav-icon">首</span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="menu.html">
        <span class="nav-icon">餐</span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="saving-card.html">
        <span class="nav-icon">卡</span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="order.html">
        <span class="nav-icon">单</span>
        <span>订单</span>
      </a>
      <a class="nav-item" data-nav-key="mine" href="mine.html">
        <span class="nav-icon">我</span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/common.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
