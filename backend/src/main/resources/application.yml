server:
  port: 8080

spring:
  application:
    name: yunbao-ordering-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/unmanned_ordering?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:qwe6649qwe}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data-mysql.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
  token-secret: ${ADMIN_TOKEN_SECRET:local-admin-secret}

wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
