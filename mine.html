<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>我的 - 云豹小点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;900&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=2">
  <link rel="stylesheet" href="css/mine.css?v=3">
</head>
<body data-page="mine">
  <div class="app-shell mine-shell">

    <header class="mine-hero">
      <div class="hero-actions">
        <button class="hero-icon-btn" type="button" aria-label="消息">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5683c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5C4 5.12 5.12 4 6.5 4h11C18.88 4 20 5.12 20 6.5v8c0 1.38-1.12 2.5-2.5 2.5H9l-4 3v-3H6.5C5.12 17 4 15.88 4 14.5v-8z"/>
            <circle cx="9" cy="10.5" r="0.9" fill="#5683c4"/>
            <circle cx="12" cy="10.5" r="0.9" fill="#5683c4"/>
            <circle cx="15" cy="10.5" r="0.9" fill="#5683c4"/>
          </svg>
        </button>
        <button class="hero-icon-btn" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5683c4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/>
            <path d="M19.4 13.8l1.5 1.1-1.6 2.8-1.8-.6a7.4 7.4 0 0 1-1.7 1l-.3 1.9h-3.2l-.3-1.9a7.4 7.4 0 0 1-1.7-1l-1.8.6L7 14.9l1.5-1.1a7.5 7.5 0 0 1 0-1.9L7 10.8l1.6-2.8 1.8.6a7.4 7.4 0 0 1 1.7-1l.3-1.9h3.2l.3 1.9a7.4 7.4 0 0 1 1.7 1l1.8-.6 1.6 2.8-1.5 1.1c.1.6.1 1.3 0 1.9z"/>
          </svg>
        </button>
      </div>

      <img class="hero-mascot-cup" src="images/home-mascot-cup.png" alt="云豹小点">

      <div class="hero-profile" data-dev-login style="cursor:pointer">
        <img class="hero-avatar" src="images/mascot-yunbao-144.png" alt="头像">
        <div class="hero-text">
          <h1 class="hero-title">登录 / 注册</h1>
          <p class="hero-subtitle">登录后解锁更多权益</p>
        </div>
      </div>
    </header>

    <main class="page-main mine-main">

      <section class="member-card">
        <div class="member-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M7 4h10l3.2 5L12 20.5 3.8 9 7 4z" fill="#ffffff" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round"/>
            <path d="M3.8 9h16.4M9.5 4l-2.1 5 4.6 11.5M14.5 4l2.1 5-4.6 11.5" stroke="#cfe2ff" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="member-text">
          <h2 class="member-title-line">
            云豹会员
            <span class="member-arrow">›</span>
          </h2>
          <p class="member-sub">享专属优惠 · 积分加倍 · 生日礼遇</p>
        </div>
        <a class="member-btn" href="saving-card.html">查看会员权益</a>
      </section>

      <section class="asset-card">
        <h3 class="block-title">我的资产</h3>
        <div class="asset-grid">
          <div class="asset-item">
            <span class="asset-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
                <path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/>
                <circle cx="15" cy="9.5" r="1.1" fill="#1f6fff"/>
              </svg>
            </span>
            <div class="asset-num-row">
              <strong class="asset-num" data-asset="coupon">0</strong>
              <span class="asset-unit">张</span>
            </div>
            <div class="asset-label">优惠券 ›</div>
          </div>
          <div class="asset-item">
            <span class="asset-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 7l1.5 3 3.3.5-2.4 2.3.6 3.3L12 14.6l-3 1.5.6-3.3L7.2 10.5 10.5 10 12 7z" fill="#1f6fff"/>
              </svg>
            </span>
            <div class="asset-num-row">
              <strong class="asset-num" data-asset="points">0</strong>
            </div>
            <div class="asset-label">积分 ›</div>
          </div>
          <div class="asset-item">
            <span class="asset-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
                <path d="M4 8a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1H6a2 2 0 0 0 0 4h13v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/>
                <circle cx="16" cy="11" r="1.1" fill="#1f6fff"/>
              </svg>
            </span>
            <div class="asset-num-row">
              <strong class="asset-num" data-asset="balance">¥ 0.00</strong>
            </div>
            <div class="asset-label">余额 ›</div>
          </div>
        </div>
      </section>

      <section class="orders-card">
        <h3 class="block-title">我的订单</h3>
        <div class="orders-grid">
          <a class="order-item" href="order.html">
            <span class="order-icon">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/>
                <path d="M4 11h16"/>
                <circle cx="16" cy="14.5" r="0.9" fill="#1f6fff"/>
              </svg>
            </span>
            <span class="order-label">待付款</span>
          </a>
          <a class="order-item" href="order.html">
            <span class="order-icon order-icon-badge">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5" width="17" height="15" rx="2.5"/>
                <path d="M3.5 9.5h17"/>
                <path d="M8 3.5v3M16 3.5v3"/>
                <circle cx="12" cy="14.5" r="3"/>
                <path d="M12 13v1.7l1 0.6"/>
              </svg>
              <span class="badge-dot" data-order-badge="pickup">2</span>
            </span>
            <span class="order-label">待取餐</span>
          </a>
          <a class="order-item" href="order.html">
            <span class="order-icon">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4.5" width="16" height="16" rx="2.5"/>
                <path d="M8.5 12.5l2.5 2.5 4.5-5"/>
              </svg>
            </span>
            <span class="order-label">已完成</span>
          </a>
          <a class="order-item" href="order.html">
            <span class="order-icon">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.5 13.5v-1a7.5 7.5 0 0 1 15 0v1"/>
                <rect x="3.5" y="13.5" width="4" height="6" rx="1.2"/>
                <rect x="16.5" y="13.5" width="4" height="6" rx="1.2"/>
                <path d="M16.5 19.5v.5a2 2 0 0 1-2 2H12"/>
              </svg>
            </span>
            <span class="order-label">售后</span>
          </a>
        </div>
      </section>

      <section class="features-card">
        <h3 class="block-title">我的功能</h3>
        <div class="features-grid">
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-6.5-5.5-6.5-11a6.5 6.5 0 1 1 13 0c0 5.5-6.5 11-6.5 11z"/>
                <circle cx="12" cy="10" r="2.3"/>
              </svg>
            </span>
            <span class="feature-label">收货地址</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13v-1a7 7 0 0 1 14 0v1"/>
                <rect x="3.5" y="13" width="4" height="6" rx="1.2"/>
                <rect x="16.5" y="13" width="4" height="6" rx="1.2"/>
              </svg>
            </span>
            <span class="feature-label">联系客服</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3.5h9l4 4v12.2c0 .7-.7 1.1-1.3.7L16 19l-1.7 1.4-1.7-1.4-1.6 1.4-1.7-1.4L7.6 20.4c-.6.4-1.3 0-1.3-.7V3.5z"/>
                <path d="M9 9.5h7M9 13h7"/>
              </svg>
            </span>
            <span class="feature-label">发票助手</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5l7 4v9l-7 4-7-4v-9l7-4z"/>
                <circle cx="12" cy="12" r="2.4"/>
              </svg>
            </span>
            <span class="feature-label">设置</span>
          </a>

          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5"/>
                <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/>
                <circle cx="12" cy="16.6" r="0.9" fill="#1f6fff" stroke="none"/>
              </svg>
            </span>
            <span class="feature-label">帮助中心</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4l2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.8l-5 2.6.9-5.6-4-3.9 5.6-.8L12 4z"/>
              </svg>
            </span>
            <span class="feature-label">口味收藏</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="7" rx="6.5" ry="2.4"/>
                <path d="M5.5 7v5c0 1.3 2.9 2.4 6.5 2.4s6.5-1.1 6.5-2.4V7"/>
                <path d="M5.5 12v5c0 1.3 2.9 2.4 6.5 2.4s6.5-1.1 6.5-2.4v-5"/>
              </svg>
            </span>
            <span class="feature-label">积分记录</span>
          </a>
          <a class="feature-item" href="#">
            <span class="feature-icon-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#1f6fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="9" width="17" height="4" rx="1"/>
                <path d="M5 13v7h14v-7"/>
                <path d="M12 9v11"/>
                <path d="M12 9c-1.5-3-5.5-3-5.5-.5S9 9 12 9zM12 9c1.5-3 5.5-3 5.5-.5S15 9 12 9z"/>
              </svg>
            </span>
            <span class="feature-label">兑换记录</span>
          </a>
        </div>
      </section>

      <section class="story-row">
        <a class="story-card" href="#">
          <div class="story-text">
            <strong class="story-title">云豹故事</strong>
            <span class="story-sub">了解云豹小点</span>
          </div>
          <img class="story-img" src="images/mine-story-leopard.png" alt="云豹故事">
        </a>
        <a class="story-card" href="#">
          <div class="story-text">
            <strong class="story-title">加入云豹</strong>
            <span class="story-sub">成为校园合作伙伴</span>
          </div>
          <div class="story-illu">
            <svg viewBox="0 0 120 96" width="110" height="88" fill="none" stroke="#9cc3f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M52 14h28l-3 32a6 6 0 0 1-6 5.5H61a6 6 0 0 1-6-5.5l-3-32z"/>
              <path d="M52 22h28"/>
              <path d="M62 8v8M70 7v9M58 9v7" stroke="#bcd6f8"/>
              <circle cx="66" cy="34" r="5" fill="#bcd6f8" stroke="none"/>
              <path d="M62 33c0-1.5 1.3-2.6 2.8-2.6 0.4-1.3 1.7-2.2 3.2-2.2 2 0 3.6 1.6 3.6 3.6 0 0.2 0 0.4-.05 .6 1.2 .3 2.1 1.4 2.1 2.6" stroke="#ffffff" stroke-width="0.9"/>
              <ellipse cx="30" cy="78" rx="18" ry="6"/>
              <ellipse cx="64" cy="82" rx="26" ry="7"/>
              <ellipse cx="96" cy="78" rx="18" ry="6"/>
            </svg>
          </div>
        </a>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="index.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-home.svg" alt=""></span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="menu.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-menu.svg" alt=""></span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="saving-card.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-saving.svg" alt=""></span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="order.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-order.svg" alt=""></span>
        <span>订单</span>
      </a>
      <a class="nav-item is-active" data-nav-key="mine" href="mine.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-mine-active.svg" alt=""></span>
        <span>我的</span>
      </a>
    </nav>
  </div>
