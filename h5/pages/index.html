<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>云豹小点 - 首页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css?v=2">
  <link rel="stylesheet" href="/css/home.css?v=3">
</head>
<body data-page="home">
  <div class="app-shell home-shell">

    <header class="home-topbar">
      <div class="ht-capsule">
        <button class="ht-cap-btn" type="button" aria-label="更多">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
        </button>
        <i class="ht-cap-sep"></i>
        <button class="ht-cap-btn" type="button" aria-label="位置">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="carousel" data-carousel>
      <div class="carousel-inner" data-carousel-inner>

        <article class="c-slide" data-slide="0">
          <div class="c-bg c-bg-1"></div>
        </article>

        <article class="c-slide" data-slide="1">
          <div class="c-bg c-bg-2"></div>
        </article>

        <article class="c-slide" data-slide="2">
          <div class="c-bg c-bg-3"></div>
        </article>

      </div>

      <div class="c-overlay"></div>

      <div class="c-indicators" data-carousel-indicators>
        <span class="c-dot is-active"></span>
        <span class="c-dot"></span>
        <span class="c-dot"></span>
      </div>

      <p class="c-disclaim">*图片仅供参考,实际以出杯为准</p>
    </section>

    <main class="content-overlay">

      <section class="member-progress-card">
        <div class="mpc-avatar">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="#9ca3af" aria-hidden="true">
            <circle cx="16" cy="11" r="6"/>
            <path d="M4 28c2-7 8-10 12-10s10 3 12 10z"/>
          </svg>
        </div>
        <div class="mpc-body">
          <div class="mpc-name">爱嫩仙草满福的...</div>
          <div class="mpc-row">
            <div class="mpc-progress">
              <div class="mpc-progress-bg">
                <div class="mpc-progress-fill" style="width: 33%"></div>
              </div>
              <span class="mpc-count">1/3杯</span>
            </div>
            <button class="mpc-btn" type="button">去领取</button>
          </div>
        </div>
      </section>

      <div class="home-divider"></div>

      <section class="pickup-split">
        <button class="ps-side" type="button" data-mode="pickup">
          <span class="ps-zh">自取</span>
          <span class="ps-en">Pickup</span>
        </button>
        <div class="ps-divider"></div>
        <button class="ps-side" type="button" data-mode="delivery">
          <span class="ps-bubble">最高享免配!</span>
          <span class="ps-zh">外卖</span>
          <span class="ps-en">Deliver</span>
        </button>
      </section>

      <div class="home-divider"></div>

      <section class="quick-grid">
        <a class="qg-item" href="/menu.html">
          <div class="qg-icon qg-icon-99">
            <span class="qg-99-num">9.9</span>
            <span class="qg-99-tag">喝咖啡</span>
          </div>
          <span class="qg-h">高品质咖啡</span>
          <span class="qg-sub">全场9.9</span>
        </a>
        <a class="qg-item" href="/saving-card.html">
          <div class="qg-icon qg-icon-30">
            <span class="qg-30-num">领30元</span>
            <span class="qg-30-tag">券</span>
          </div>
          <span class="qg-h">领30元券包</span>
          <span class="qg-sub">加入社群</span>
        </a>
        <a class="qg-item" href="/mine.html">
          <div class="qg-icon qg-icon-points">
            <svg viewBox="0 0 32 24" width="34" height="24" fill="none" stroke="#191c23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="20" height="12" rx="1.6"/>
              <circle cx="16" cy="4" r="2"/>
              <circle cx="24" cy="20" r="2" fill="#191c23"/>
            </svg>
          </div>
          <span class="qg-h">积分兑换</span>
          <span class="qg-sub">专享福利</span>
        </a>
        <a class="qg-item" href="/saving-card.html">
          <div class="qg-icon qg-icon-code">
            <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="#191c23" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 2">
              <rect x="6" y="6" width="20" height="20" rx="1.6"/>
              <path d="M6 16h20" stroke-dasharray="3 2"/>
            </svg>
          </div>
          <span class="qg-h">券码兑换</span>
          <span class="qg-sub">立享优惠</span>
        </a>
      </section>
    </main>

    <nav class="bottom-nav home-bottom-nav" aria-label="底部导航">
      <a class="nav-item is-active" data-nav-key="home" href="/index.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-home.svg" alt=""></span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="/menu.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-menu.svg" alt=""></span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="/saving-card.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-saving.svg" alt=""></span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="/order.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-order.svg" alt=""></span>
        <span>订单</span>
      </a>
      <a class="nav-item" data-nav-key="mine" href="/mine.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-mine.svg" alt=""></span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/home.js?v=3"></script>
</body>
</html>
