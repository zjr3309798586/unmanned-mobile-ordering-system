<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>云豹小点 - 点餐</title>
  <link rel="stylesheet" href="/css/common.css?v=2">
  <link rel="stylesheet" href="/css/menu.css?v=7">
</head>
<body data-page="menu">
  <div class="app-shell menu-shell">

    <!-- ======= 顶部 ======= -->
    <header class="menu-header">

      <div class="mh-top-row">
        <div class="mh-tabs">
          <span class="mh-tab is-active">自取<i class="mh-tab-bar"></i></span>
          <span class="mh-tab-sep">|</span>
          <span class="mh-tab">外卖</span>
        </div>
        <div class="mh-actions">
          <button class="mh-icon-btn" type="button" aria-label="搜索">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="M21 21l-5.2-5.2"/>
            </svg>
          </button>
          <div class="mh-pill-group">
            <button class="mh-pill-btn" type="button" aria-label="更多">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
            </button>
            <i class="mh-pill-sep"></i>
            <button class="mh-pill-btn" type="button" aria-label="扫码">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <rect x="9" y="9" width="6" height="6" rx="0.6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="mh-store">
        <svg class="mh-store-star" viewBox="0 0 24 24" width="18" height="18" fill="#d1d5db" aria-hidden="true">
          <path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.7l-6.2 3.5 1.6-6.9L2.1 9.6l7-.7L12 2.5z"/>
        </svg>
        <span class="mh-store-name">云豹双流北京华联店</span>
        <svg class="mh-store-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </div>

      <div class="mh-meta">
        <span>距离您1.10km</span>
        <span class="mh-meta-sep">|</span>
        <span class="mh-meta-tag">下单立即制作</span>
      </div>

      <div class="mh-promo-row">
        <div class="mh-promo-text">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 16H7a4.5 4.5 0 1 1 0-9h3l8-4v17l-8-4z"/>
          </svg>
          <span>高品质茶饮全场9.9元喝</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
        <button class="mh-promo-btn" type="button">拼单</button>
      </div>
    </header>

    <!-- ======= 主区:左 sidebar + 右商品 ======= -->
    <main class="menu-body">

      <aside class="menu-side" aria-label="商品分类">
        <ul class="ms-list">
          <li class="ms-item is-active"><span class="ms-label">加载中</span></li>
        </ul>
      </aside>

      <section class="menu-list" data-menu-list>
        <div class="ml-cat-head">加载中...</div>
        <div class="ml-items"></div>
      </section>
    </main>

    <!-- ======= 左下角浮动优惠券 ======= -->
    <div class="coupon-float" data-coupon-toggle aria-label="优惠券">
      <strong data-coupon-count>0</strong>
      <span>优惠券</span>
    </div>

    <!-- 我的优惠券抽屉 -->
    <div class="coupon-mask" data-coupon-mask></div>
    <aside class="coupon-drawer" data-coupon-drawer>
      <div class="cd-head">
        <strong>我的优惠券</strong>
        <button class="cd-close" type="button" data-coupon-close>关闭</button>
      </div>
      <div class="cd-list" data-coupon-list>
        <p class="cd-empty">加载中...</p>
      </div>
      <a class="cd-go-cart" href="/cart.html">去购物车使用 ›</a>
    </aside>

    <!-- ======= 搜索 overlay ======= -->
    <div class="search-overlay" data-search-overlay>
      <div class="so-bar">
        <div class="so-input-wrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5.2-5.2"/></svg>
          <input class="so-input" type="search" placeholder="搜索商品名称" data-search-input autocomplete="off">
        </div>
        <button class="so-cancel" type="button" data-search-cancel>取消</button>
      </div>
      <div class="so-results" data-search-results>
        <p class="so-empty">输入关键字搜索商品</p>
      </div>
    </div>

    <!-- ======= 购物车抽屉 ======= -->
    <div class="cart-mask" data-cart-mask></div>
    <aside class="cart-drawer" data-cart-drawer>
      <div class="cd-head">
        <strong class="cd-title">已选商品</strong>
        <button class="cd-clear" type="button" data-cart-clear>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>
          清空
        </button>
      </div>
      <div class="cd-list" data-cart-drawer-list>
        <p class="cd-empty">购物车空空,点商品旁的 + 加进来吧</p>
      </div>
    </aside>

    <!-- ======= 底部购物车 ======= -->
    <footer class="cart-bar" data-cart-bar>
      <div class="cart-bar-left">
        <div class="cart-bag-circle">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 10V7a4 4 0 1 0-8 0v3M4 9h16l-1 11.5a1.2 1.2 0 0 1-1.2 1H6.2A1.2 1.2 0 0 1 5 20.5L4 9z"/>
          </svg>
          <em class="cart-bag-badge" data-cart-count style="display:none">0</em>
        </div>
        <span class="cart-bar-text" data-cart-empty-text>未选购商品</span>
        <strong class="cart-bar-total" data-cart-total style="display:none">¥0</strong>
      </div>
      <a class="cart-bar-btn is-disabled" href="/cart.html" data-cart-go>去结算</a>
    </footer>

    <!-- ======= 底部 5 项导航 ======= -->
    <nav class="bottom-nav menu-bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="/index.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-home.svg" alt=""></span>
        <span>首页</span>
      </a>
      <a class="nav-item is-active" data-nav-key="menu" href="/menu.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-menu.svg" alt=""></span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="/saving-card.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-saving.svg" alt=""></span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="/order.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-order.svg" alt=""></span>
        <span>订单</span>
      </a>
      <a class="nav-item" data-nav-key="mine" href="/mine.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-mine.svg" alt=""></span>
        <span>我的</span>
      </a>
    </nav>

  </div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/menu.js?v=8"></script>
</body>
</html>
