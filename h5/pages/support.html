<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>客服中心 - 云豹小点</title>
  <link rel="stylesheet" href="../css/common.css?v=2">
  <link rel="stylesheet" href="../css/support.css?v=9">
</head>
<body data-page="support">
  <div class="app-shell support-shell">
    <header class="support-top">
      <button class="support-back" type="button" aria-label="返回" onclick="history.back()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="support-title-group">
        <h1>云豹客服</h1>
        <p><span class="online-dot"></span>智能助手在线</p>
      </div>
      <button class="support-top-link" type="button" data-support-refresh>刷新</button>
    </header>

    <main class="support-main support-chat-main">
      <section class="support-chat-head">
        <img src="../images/mascot/mascot-yunbao-144.png" alt="云豹客服">
        <div>
          <strong>云豹小点·校园店</strong>
          <p>营业中 · 08:00-22:30 · 平均 30 秒响应</p>
        </div>
        <span class="support-service-status">可转人工</span>
      </section>

      <section class="support-chat-panel">
        <div class="support-date-divider">今天</div>
        <div class="support-bot-thread" data-bot-thread>
          <article class="support-chat-item">
            <div class="support-bubble-row is-service">
              <img class="support-avatar" src="../images/mascot/mascot-yunbao-144.png" alt="智能助手">
              <div class="support-bubble support-bot-bubble">
                <div class="bubble-head"><span>智能助手</span><em>自动回复</em></div>
                <p>你好，我是云豹小点智能助手。你可以直接描述问题，我会先帮你快速解答；如果没有解决，再转给员工继续处理。</p>
                <div class="support-service-card">
                  <strong>常见服务</strong>
                  <span>取餐进度、优惠券、订单取消、商品问题都可以处理</span>
                </div>
                <div class="bot-action-row">
                  <button type="button" data-bot-quick="pickup">查取餐进度</button>
                  <button type="button" data-bot-quick="coupon">优惠券不能用</button>
                  <button type="button" data-bot-quick="order">取消/修改订单</button>
                  <button type="button" data-bot-quick="product">商品口味问题</button>
                </div>
              </div>
            </div>
          </article>
        </div>
        <div class="support-inline-thread">
          <div class="support-loading" data-support-loading>正在加载人工客服消息...</div>
          <div class="support-list support-chat-list" data-support-list></div>
          <div class="support-empty" data-support-empty hidden>
            <strong>暂无人工客服消息</strong>
            <p>机器人没有解决时，点击“没解决，转人工”，员工回复会直接出现在当前对话里。</p>
          </div>
        </div>
      </section>

      <form class="support-composer" data-support-form>
        <div class="composer-tools" data-composer-tools hidden>
          <div class="composer-tool-title">更多信息可选填，方便员工更快处理</div>
          <select data-support-type aria-label="问题类型">
            <option value="ORDER_ISSUE">订单问题</option>
            <option value="PICKUP_ISSUE">取餐问题</option>
            <option value="PRODUCT_ISSUE">商品问题</option>
            <option value="SUGGESTION">意见建议</option>
            <option value="OTHER">其他问题</option>
          </select>
          <select data-support-order aria-label="关联订单">
            <option value="">不关联订单</option>
          </select>
          <input data-support-contact maxlength="100" placeholder="联系方式选填">
        </div>
        <div class="composer-input-row">
          <button class="composer-more-btn" type="button" data-composer-more-toggle aria-label="更多选项">+</button>
          <textarea data-support-content rows="1" maxlength="1000" placeholder="请输入问题，像聊天一样发送"></textarea>
          <button class="support-submit" type="submit" data-support-submit>发送</button>
        </div>
      </form>
    </main>

  </div>

  <script src="../js/common.js?v=2"></script>
  <script src="../js/support.js?v=8"></script>
</body>
</html>
