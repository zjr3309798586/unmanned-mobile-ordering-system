<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>收货地址 - 云豹小点</title>
  <link rel="stylesheet" href="/css/common.css?v=2">
  <link rel="stylesheet" href="/css/address.css?v=2">
</head>
<body data-page="address">
  <div class="app-shell address-shell">
    <header class="address-topbar">
      <button class="address-back" type="button" onclick="history.back()" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#102033" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1>收货地址</h1>
      <button class="address-add-link" type="button" data-add-address>新增</button>
    </header>

    <main class="address-main">
      <section class="address-hero">
        <div>
          <strong>管理你的配送地址</strong>
          <p>外送下单时会优先使用默认地址，也可以从这里选择本次地址。</p>
        </div>
        <span class="address-hero-icon">
          <svg viewBox="0 0 40 40" width="32" height="32" fill="none"><path d="M20 36s12-10.2 12-21A12 12 0 0 0 8 15c0 10.8 12 21 12 21z" fill="#1F6FFF"/><circle cx="20" cy="15" r="4.2" fill="#fff"/></svg>
        </span>
      </section>

      <section class="address-list" data-address-list>
        <div class="address-loading">正在加载地址...</div>
      </section>

      <button class="address-primary" type="button" data-add-address>新增收货地址</button>
    </main>

    <div class="address-mask" data-address-mask hidden></div>
    <aside class="address-drawer" data-address-drawer hidden>
      <div class="drawer-head">
        <strong data-drawer-title>新增收货地址</strong>
        <button type="button" data-close-drawer>关闭</button>
      </div>
      <form class="address-form" data-address-form>
        <label>
          <span>收货人</span>
          <input name="receiverName" type="text" maxlength="30" placeholder="例如：张同学" required>
        </label>
        <label>
          <span>联系电话</span>
          <input name="phone" type="tel" maxlength="30" placeholder="例如：13800000000" required>
        </label>
        <label>
          <span>详细地址</span>
          <textarea name="addressDetail" maxlength="160" placeholder="例如：3号宿舍楼 502" required></textarea>
        </label>
        <label class="default-row">
          <span>设为默认地址</span>
          <input name="defaultAddress" type="checkbox">
        </label>
        <button class="address-primary drawer-submit" type="submit">保存地址</button>
      </form>
    </aside>

    <nav class="bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="/index.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-home.svg" alt=""></span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="/menu.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-menu.svg" alt=""></span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="/saving-card.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-saving.svg" alt=""></span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="/order.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-order.svg" alt=""></span>
        <span>订单</span>
      </a>
      <a class="nav-item is-active" data-nav-key="mine" href="/mine.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="/images/nav/nav-mine-active.svg" alt=""></span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/address.js?v=1"></script>
</body>
</html>
