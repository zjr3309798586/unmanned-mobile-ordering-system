<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>商品详情 - 云豹小点</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css?v=2">
  <link rel="stylesheet" href="/css/detail.css?v=7">
</head>
<body data-page="detail" data-unit-price="13.9">
  <div class="app-shell detail-shell">

    <!-- ======= 顶部图区 ======= -->
    <header class="d-img-wrap">
      <div class="d-topbar">
        <button class="d-icon-btn" type="button" aria-label="返回" onclick="history.back()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#191c23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="d-top-right">
          <button class="d-icon-btn" type="button" aria-label="分享">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#191c23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1M16 8l-4-4M12 4l-4 4M12 4v12"/>
            </svg>
          </button>
          <div class="d-top-pill">
            <span class="d-pill-dots"><i></i><i></i><i></i></span>
            <span class="d-pill-sep"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#191c23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>
      </div>
      <img class="d-hero-img" src="/images/menu/menu-product-orange.png" alt="商品图">
    </header>

    <!-- ======= 主体 ======= -->
    <main class="d-main">

      <div class="d-head-row">
        <div class="d-head-text">
          <h1 class="d-name">荔枝冰奶</h1>
          <p class="d-desc">手剥时令妃子笑 | 广西横州七窨茉莉花茶 | 冷链鲜奶</p>
        </div>
        <button class="d-fav" type="button" data-fav-btn>
          <span class="d-fav-icon" data-fav-icon>☆</span>
          <span>口味收藏</span>
        </button>
      </div>

      <div class="d-divider"></div>

      <div class="d-options">
        <section class="d-opt-row" data-opt-group="size" data-opt-name="规格">
          <div class="d-opt-label"><span>规格</span><em>*</em></div>
          <div class="d-opt-btns">
            <button class="d-opt-btn is-active" type="button" data-opt="中¥17">中¥17</button>
          </div>
        </section>

        <section class="d-opt-row" data-opt-group="temp" data-opt-name="温度">
          <div class="d-opt-label"><span>温度</span><em>*</em></div>
          <div class="d-opt-btns">
            <button class="d-opt-btn is-active" type="button" data-opt="正常冰">正常冰</button>
            <button class="d-opt-btn" type="button" data-opt="少冰">少冰</button>
          </div>
        </section>

        <section class="d-opt-row" data-opt-group="sugar-type" data-opt-name="选糖">
          <div class="d-opt-label"><span>选糖</span><em>*</em></div>
          <div class="d-opt-btns">
            <button class="d-opt-btn is-active" type="button" data-opt="默认糖">默认糖</button>
          </div>
        </section>

        <section class="d-opt-row" data-opt-group="sweet" data-opt-name="甜度">
          <div class="d-opt-label"><span>甜度</span><em>*</em></div>
          <div class="d-opt-btns">
            <button class="d-opt-btn" type="button" data-opt="十分甜">十分甜</button>
            <button class="d-opt-btn" type="button" data-opt="不额外加糖">不额外加糖</button>
            <button class="d-opt-btn is-active" type="button" data-opt="七分甜">七分甜</button>
            <button class="d-opt-btn" type="button" data-opt="五分甜">五分甜</button>
          </div>
        </section>
      </div>
    </main>

    <!-- ======= sticky 底部 ======= -->
    <footer class="d-footer">
      <div class="d-foot-row">
        <div class="d-price-line">
          <span class="d-pr-yuan">¥</span>
          <span class="d-pr-int" data-pr-int>13.9</span>
          <span class="d-pr-tip">到手价<i>?</i></span>
          <span class="d-pr-origin">¥15</span>
          <span class="d-pr-origin">¥17</span>
        </div>
        <div class="d-qty">
          <button class="d-qty-minus" type="button" data-qty-minus aria-label="减">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#414754" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <span class="d-qty-num" data-qty-num>1</span>
          <button class="d-qty-plus" type="button" data-qty-plus aria-label="加">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>

      <div class="d-spec-summary" data-spec-summary>中/正常冰/默认糖/七分甜</div>

      <button class="d-cta" type="button" data-add-cart>加入购物车</button>
    </footer>

  </div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/detail.js?v=6"></script>
</body>
</html>
