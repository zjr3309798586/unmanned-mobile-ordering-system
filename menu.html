<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>点餐页 - 无人移动点餐系统</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body data-page="menu">
  <div class="app-shell">
    <header class="top-area">
      <section class="store-card compact-store">
        <div class="store-header">
          <div>
            <span class="store-label">点餐门店</span>
            <h1 class="store-name">正在读取门店</h1>
          </div>
          <span class="status-pill is-open">读取中</span>
        </div>
        <div class="store-meta">
          <span>堂食</span>
          <span>自取</span>
          <span>平台外送</span>
        </div>
      </section>

      <label class="search-bar" aria-label="搜索菜单">
        <span class="search-icon">搜</span>
        <input class="search-input" type="search" placeholder="搜索商品、口味、套餐">
      </label>
    </header>

    <main class="page-main with-floating-bar">
      <section class="section-card promo-tip-card">
        <div class="section-head compact-head">
          <div>
            <h2 class="section-title">今日点餐优惠</h2>
            <p class="section-note" data-menu-promo-note>正在读取当前可用优惠券...</p>
          </div>
        </div>
      </section>

      <section class="menu-layout">
        <aside class="section-card category-panel">
          <div class="category-list">
            <button class="category-button is-active" type="button">加载中</button>
          </div>
        </aside>

        <div class="menu-content">
          <section class="section-card menu-group">
            <p class="section-note">正在读取当前门店商品...</p>
          </section>
        </div>
      </section>
    </main>

    <div class="floating-bar settlement-bar is-hidden" data-settlement-bar>
      <div class="cart-preview" data-cart-preview></div>
      <div class="settlement-main">
        <div class="floating-summary">
          <span class="floating-label">已选商品</span>
          <strong class="floating-price" data-cart-total>¥ 0.00</strong>
          <span class="floating-label"><span data-cart-count>0</span> 件商品</span>
        </div>
        <div class="floating-actions">
          <a class="button button-secondary" href="cart.html">购物车</a>
          <a class="button button-primary" href="cart.html">去结算</a>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="index.html">
        <span class="nav-icon">首</span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="menu.html">
        <span class="nav-icon">餐</span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="saving-card.html">
        <span class="nav-icon">卡</span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="order.html">
        <span class="nav-icon">单</span>
        <span>订单</span>
      </a>
      <a class="nav-item" data-nav-key="mine" href="mine.html">
        <span class="nav-icon">我</span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/common.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
