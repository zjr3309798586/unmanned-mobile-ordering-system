<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>购物车页 - 云豹小点</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body data-page="cart">
  <div class="app-shell">
    <header class="top-area">
      <section class="store-card compact-store">
        <div class="store-header">
          <div>
            <span class="store-label">当前购物车</span>
            <h1 class="store-name">正在读取门店</h1>
          </div>
          <span class="status-pill">支持继续加购</span>
        </div>
        <p class="store-address">已选商品将保存在当前门店购物车中，可直接跳转提交订单页。</p>
      </section>
    </header>

    <main class="page-main with-floating-bar">
      <section class="section-card tip-card">
        <div class="section-head compact-head">
          <div>
            <h2 class="section-title">优惠提示</h2>
            <p class="section-note">当前可用满减券与省钱卡优惠</p>
          </div>
        </div>
        <p class="info-text" data-cart-tip-text>正在读取当前可用优惠...</p>
      </section>

      <section class="section-card">
        <div class="section-head">
          <div>
            <h2 class="section-title">已选商品</h2>
            <p class="section-note">支持数量修改与删除</p>
          </div>
          <a class="section-link" href="menu.html">继续点餐</a>
        </div>
        <div class="cart-item-list" data-cart-list>
          <p class="section-note">正在读取购物车...</p>
        </div>
      </section>

      <section class="section-card">
        <div class="section-head compact-head">
          <div>
            <h2 class="section-title">费用明细</h2>
            <p class="section-note">当前金额来自购物车已选商品</p>
          </div>
        </div>
        <div class="summary-list">
          <div class="summary-row">
            <span>商品总价</span>
            <strong data-goods-total>¥ 0.00</strong>
          </div>
          <div class="summary-row">
            <span>包装费</span>
            <strong data-packaging-fee>¥ 0.00</strong>
          </div>
          <div class="summary-row">
            <span>优惠金额</span>
            <strong class="discount-price" data-discount-total>- ¥ 0.00</strong>
          </div>
          <div class="summary-row total-row">
            <span>应付金额</span>
            <strong class="accent-price" data-pay-total>¥ 0.00</strong>
          </div>
        </div>
      </section>

      <section class="section-card hidden-card" data-cart-empty>
        <div class="empty-state">
          <strong>购物车暂时为空</strong>
          <p>可以从菜单页继续选择商品，加入后会显示在这里。</p>
          <a class="button button-primary" href="menu.html">返回点餐页</a>
        </div>
      </section>
    </main>

    <div class="floating-bar checkout-bar">
      <div class="floating-summary">
        <span class="floating-label">待结算金额</span>
        <strong class="floating-price" data-bar-pay-total>¥ 0.00</strong>
        <span class="floating-label"><span data-bar-item-count>0</span> 件商品</span>
      </div>
      <div class="floating-actions">
        <a class="button button-primary" href="submit-order.html">去结算</a>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="底部导航">
      <a class="nav-item" data-nav-key="home" href="index.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-home.svg" alt=""></span>
        <span>首页</span>
      </a>
      <a class="nav-item" data-nav-key="menu" href="menu.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-menu.svg" alt=""></span>
        <span>点餐</span>
      </a>
      <a class="nav-item" data-nav-key="saving-card" href="saving-card.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-saving.svg" alt=""></span>
        <span>省钱卡</span>
      </a>
      <a class="nav-item" data-nav-key="order" href="order.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-order.svg" alt=""></span>
        <span>订单</span>
      </a>
      <a class="nav-item" data-nav-key="mine" href="mine.html">
        <span class="nav-icon"><img class="nav-logo-icon" src="images/nav-mine.svg" alt=""></span>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
